[workspace]
resolver = "2"
members = [
    "crates/ride-core",
    "crates/ride-discovery",
    "crates/ride-moe",
    "crates/ride-skills",
    "crates/ride-agent",
    "crates/ride-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["R.I.D.E Developers"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ride-core = { path = "crates/ride-core" }
ride-discovery = { path = "crates/ride-discovery" }
ride-moe = { path = "crates/ride-moe" }
ride-skills = { path = "crates/ride-skills" }
ride-agent = { path = "crates/ride-agent" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.41", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"        # Optimize for size and minimal RAM footprint
lto = true             # Enable Link-Time Optimization
codegen-units = 1      # Reduce parallelism in codegen to maximize size reduction
panic = "abort"        # Minimize binary overhead
strip = true           # Strip debug symbols from binary
